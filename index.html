<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make Me Up!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Make Me Up!</h1>
        <p>Create your own look</p>
    </header>

    <main>
        <section>
            <img src="" alt="Karakter Game">
            <button type="button">START</button>
        </section>

        <section id="makeup-screen">
            <h2>Create Your Look</h2>
            <p>STEP 1 OF 3</p>
            <img id="karakter-makeup" src="base.png" alt="karakter tanpa makeup">
            <h3>Makeup</h3>
            <button type="button" data-makeup="soft-pink">Soft Pink</button>
            <button type="button" data-makeup="soft-red">Soft Red Glam</button>
        </section>

        <section id="hair-screen">
            <h2>Create Your Hair</h2>
            <p>STEP 2 OF 3</p>
            <img id="karakter-hair" src="base.png" alt="karakter dengan pilihan rambut">
            <h3>Hair Style</h3>
            <button type="button" data-hair="long">Hair Down</button>
            <button type="button" data-hair="short">High Bun</button>
        </section>

        <section id="outfit-screen">
            <h2>Create Your Outfit</h2>
            <p>STEP 3 OF 3</p>
            <img id="karakter-outfit" src="base.png" alt="karakter dengan outfit yang dipilih">
            <h3>Outfit</h3>
            <button type="button" data-outfit="pink">Pink Outfit</button>
            <button type="button" data-outfit="red">Red Outfit</button>
        </section>

        <section id="result-screen">
            <h2>Your Final Look!</h2>
            <img id="karakter-hair" src="base.png" alt="Hasil alhir karakter">
            <h3>Your Look</h3>
            <button type="button" id="play-again">Play Again</button>
            <button type="button" id="home-button">Home</button>
        </section>
    </main>
    
</body>
</html>
